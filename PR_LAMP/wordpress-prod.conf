<VirtualHost *:80>
    ServerName wp.prod.local
    DocumentRoot /var/www/html/wordpress

    <Directory /var/www/html/wordpress>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/wordpress-prod_error.log
    CustomLog ${APACHE_LOG_DIR}/wordpress-prod_access.log combined
</VirtualHost>
